<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión Exitoso - EduCursos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="success-page">
        <div class="success-container">
            <div class="success-icon">👋</div>
            
            <h1 class="success-title">Bienvenido</h1>
            <p class="success-message" id="welcomeMessage">Sesión iniciada correctamente.</p>
            
            <div class="auto-redirect">
                <p>Redirigiendo en <span id="countdown">3</span> segundos...</p>
            </div>
        </div>
    </div>

    <script>
        let countdown = 3;
        
        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }
        
        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            const timer = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    goToDashboard();
                }
            }, 1000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            
            if (currentUser) {
                const displayName = currentUser.firstName || currentUser.name || 'Usuario';
                document.getElementById('welcomeMessage').textContent = 
                    `Hola ${displayName}, sesión iniciada correctamente.`;
            }
            
            const container = document.querySelector('.success-container');
            setTimeout(() => {
                container.classList.add('animate-in');
            }, 100);
            
            startCountdown();
        });
    </script>
</body>
</html>
